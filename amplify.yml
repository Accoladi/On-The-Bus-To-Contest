version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sudo yum install -y git-lfs
        - npm ci
    build:
      commands:
        - node scripts/write-contact-env.mjs
        - npm run amplify-build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
